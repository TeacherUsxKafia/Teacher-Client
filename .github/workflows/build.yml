name: Build Teacher Client

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet Packages
      run: nuget restore clientpp.sln

    - name: Build App
      run: msbuild clientpp.sln /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64

    - name: Upload Finished Client
      uses: actions/upload-artifact@v4
      with:
        name: Teacher-Client-EXE
        path: x64/Release/